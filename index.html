  <style>
    :root {
      --bg-color: #09090b;
      --bg-gradient: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255, 255, 255, 0.045) 0%, rgba(18, 18, 22, 0.40) 50%, #09090b 100%);
      --text-primary: #f4f4f5;
      --text-heading: #fafafa;
      --text-subtitle: #a1a1aa;
      --accent: #e8620c;
      --accent-hover-border: rgba(232, 98, 12, 0.50);
      --focus-halo: rgba(232, 98, 12, 0.24);
      --card-bg: #121215;
      --card-hover-bg: #17171c;
      --card-sheen: rgba(232, 98, 12, 0.08);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 10px 28px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --card-title: #fafafa;
      --card-sub: #a1a1aa;
      --icon-bg: #1b1b20;
      --icon-hover-bg: rgba(232, 98, 12, 0.12);
      --icon-border: rgba(255, 255, 255, 0.08);
      --icon-fg: #f4f4f5;
      --arrow-color: #71717a;
      --emblem-shadow: 0 0 0 5px #09090b, 0 0 0 6px rgba(255, 255, 255, 0.12), 0 18px 42px rgba(0, 0, 0, 0.60);
      --toggle-bg: #141418;
      --toggle-border: rgba(255, 255, 255, 0.12);
      --toggle-hover-bg: #1e1e24;
    }

    :root[data-theme="light"] {
      --bg-color: #faf9f6;
      --bg-gradient: radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, #faf9f6 70%);
      --text-primary: #0a0a0c;
      --text-heading: #0a0a0c;
      --text-subtitle: #27272a;
      --accent: #b84300;
      --accent-hover-border: #b84300;
      --focus-halo: rgba(184, 67, 0, 0.22);
      --card-bg: #ffffff;
      --card-hover-bg: #fcfbf9;
      --card-sheen: rgba(184, 67, 0, 0.06);
      --card-border: #3f3f46;
      --card-shadow: 0 6px 20px rgba(10, 10, 12, 0.06);
      --card-title: #0a0a0c;
      --card-sub: #27272a;
      --icon-bg: #f4f3ef;
      --icon-hover-bg: #fff3eb;
      --icon-border: #52525b;
      --icon-fg: #0a0a0c;
      --arrow-color: #27272a;
      --emblem-shadow: 0 0 0 5px #faf9f6, 0 0 0 6px #3f3f46, 0 12px 28px rgba(10, 10, 12, 0.10);
      --toggle-bg: #ffffff;
      --toggle-border: #3f3f46;
      --toggle-hover-bg: #f4f3ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-primary);
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(40px + env(safe-area-inset-top, 0px))
        calc(20px + env(safe-area-inset-right, 0px))
        calc(48px + env(safe-area-inset-bottom, 0px))
        calc(20px + env(safe-area-inset-left, 0px));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.5s cubic-bezier(0.22, 1, 0.36, 1), color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fade-rise {
      0% {
        opacity: 0;
        transform: translate3d(0, 16px, 0) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes rule-draw {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      100% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes emblem-float {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -6px, 0);
      }
    }

    .fade-in {
      animation: fade-rise 0.76s cubic-bezier(0.22, 1, 0.36, 1) var(--stagger-delay, 0s) backwards;
      will-change: transform, opacity;
    }

    .fade-in-rule {
      transform-origin: center;
      animation: rule-draw 0.8s cubic-bezier(0.22, 1, 0.36, 1) var(--stagger-delay, 0s) backwards;
      will-change: transform, opacity;
    }

    .stagger-1 { --stagger-delay: 0.04s; animation-delay: 0.04s; }
    .stagger-2 { --stagger-delay: 0.12s; animation-delay: 0.12s; }
    .stagger-3 { --stagger-delay: 0.20s; animation-delay: 0.20s; }
    .stagger-4 { --stagger-delay: 0.28s; animation-delay: 0.28s; }
    .stagger-5 { --stagger-delay: 0.36s; animation-delay: 0.36s; }
    .stagger-6 { --stagger-delay: 0.44s; animation-delay: 0.44s; }
    .stagger-7 { --stagger-delay: 0.52s; animation-delay: 0.52s; }
    .stagger-8 { --stagger-delay: 0.60s; animation-delay: 0.60s; }

    .theme-toggle {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.36s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.36s cubic-bezier(0.22, 1, 0.36, 1), color 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .theme-toggle:hover {
      background: var(--toggle-hover-bg);
      border-color: var(--accent-hover-border);
      color: var(--accent);
      transform: translate3d(0, -1px, 0);
    }

    .theme-toggle:focus-visible {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 0;
      box-shadow: 0 0 0 4px var(--focus-halo);
    }

    .theme-toggle:active {
      transform: scale(0.93);
    }

    .theme-toggle svg {
      position: absolute;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }

    :root:not([data-theme="light"]) .icon-sun {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    :root:not([data-theme="light"]) .icon-moon {
      opacity: 0;
      transform: rotate(75deg) scale(0.5);
      pointer-events: none;
    }

    :root[data-theme="light"] .icon-sun {
      opacity: 0;
      transform: rotate(-75deg) scale(0.5);
      pointer-events: none;
    }

    :root[data-theme="light"] .icon-moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .emblem-stage {
      margin-bottom: 24px;
    }

    .emblem {
      display: block;
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: var(--emblem-shadow);
      will-change: transform;
      animation: emblem-float 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      transition: box-shadow 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-heading);
      text-align: center;
      text-wrap: balance;
    }

    .rule {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin: 14px auto 12px;
      border-radius: 2px;
      transform-origin: center;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .wrap:has(a.card:hover) .rule {
      transform: scaleX(1.35);
    }

    .subtitle {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-subtitle);
      text-align: center;
      margin-bottom: 32px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    a.card {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 68px;
      padding: 14px 17px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.38s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.38s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a.card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        220px circle at var(--mx, 50%) var(--my, 50%),
        var(--card-sheen),
        transparent 72%
      );
      opacity: 0;
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a.card:hover::before,
    a.card:focus-visible::before {
      opacity: 1;
    }

    a.card:hover {
      background: var(--card-hover-bg);
      border-color: var(--accent-hover-border);
      transform: translate3d(0, -3px, 0);
    }

    a.card:focus-visible {
      background: var(--card-hover-bg);
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 0;
      box-shadow: 0 0 0 4px var(--focus-halo), var(--card-shadow);
      transform: translate3d(0, -3px, 0);
    }

    a.card:active {
      transform: scale(0.985);
      transition-duration: 0.12s;
    }

    .icon-box {
      position: relative;
      z-index: 1;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--icon-bg);
      border: 1px solid var(--icon-border);
      color: var(--icon-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.38s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.38s cubic-bezier(0.22, 1, 0.36, 1), color 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .icon-box svg {
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a.card:hover .icon-box,
    a.card:focus-visible .icon-box {
      background: var(--icon-hover-bg);
      border-color: var(--accent-hover-border);
      color: var(--accent);
      transform: scale(1.04);
    }

    a.card:hover .icon-box svg,
    a.card:focus-visible .icon-box svg {
      transform: scale(1.08);
    }

    .card-body {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--card-title);
      transition: color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card-sub {
      font-size: 13px;
      color: var(--card-sub);
      line-height: 1.35;
      transition: color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .arrow {
      position: relative;
      z-index: 1;
      color: var(--arrow-color);
      flex-shrink: 0;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), color 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a.card:hover .arrow,
    a.card:focus-visible .arrow {
      color: var(--accent);
      transform: translate3d(3px, -3px, 0);
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.38s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (max-width: 640px) {
      body {
        padding-top: calc(56px + env(safe-area-inset-top, 0px));
      }

      .theme-toggle {
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: calc(16px + env(safe-area-inset-right, 0px));
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 400px) {
      a.card {
        gap: 13px;
        padding: 13px 15px;
      }

      .card-title {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .fade-in,
      .fade-in-rule,
      .emblem-stage,
      .emblem,
      h1,
      .rule,
      .subtitle,
      a.card,
      a.card::before,
      .icon-box,
      .icon-box svg,
      .card-title,
      .card-sub,
      .arrow,
      .theme-toggle,
      .theme-toggle svg {
        animation: none;
        transition: none;
      }

      .wrap:has(a.card:hover) .rule,
      a.card:hover,
      a.card:focus-visible,
      a.card:active,
      a.card:hover .icon-box,
      a.card:focus-visible .icon-box,
      a.card:hover .icon-box svg,
      a.card:focus-visible .icon-box svg,
      a.card:hover .arrow,
      a.card:focus-visible .arrow,
      .theme-toggle:hover,
      .theme-toggle:active {
        transform: none;
      }
    }
  </style>
  <script>
    (function () {
      var THEMES = {
        dark: {
          '--bg-color': '#09090b',
          '--bg-gradient': 'radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255, 255, 255, 0.045) 0%, rgba(18, 18, 22, 0.40) 50%, #09090b 100%)',
          '--text-primary': '#f4f4f5',
          '--text-heading': '#fafafa',
          '--text-subtitle': '#a1a1aa',
          '--accent': '#e8620c',
          '--accent-hover-border': 'rgba(232, 98, 12, 0.50)',
          '--focus-halo': 'rgba(232, 98, 12, 0.24)',
          '--card-bg': '#121215',
          '--card-hover-bg': '#17171c',
          '--card-sheen': 'rgba(232, 98, 12, 0.08)',
          '--card-border': 'rgba(255, 255, 255, 0.09)',
          '--card-shadow': '0 10px 28px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.05)',
          '--card-title': '#fafafa',
          '--card-sub': '#a1a1aa',
          '--icon-bg': '#1b1b20',
          '--icon-hover-bg': 'rgba(232, 98, 12, 0.12)',
          '--icon-border': 'rgba(255, 255, 255, 0.08)',
          '--icon-fg': '#f4f4f5',
          '--arrow-color': '#71717a',
          '--emblem-shadow': '0 0 0 5px #09090b, 0 0 0 6px rgba(255, 255, 255, 0.12), 0 18px 42px rgba(0, 0, 0, 0.60)',
          '--toggle-bg': '#141418',
          '--toggle-border': 'rgba(255, 255, 255, 0.12)',
          '--toggle-hover-bg': '#1e1e24'
        },
        light: {
          '--bg-color': '#faf9f6',
          '--bg-gradient': 'radial-gradient(ellipse 70% 45% at 50% 0%, #ffffff 0%, #faf9f6 70%)',
          '--text-primary': '#0a0a0c',
          '--text-heading': '#0a0a0c',
          '--text-subtitle': '#27272a',
          '--accent': '#b84300',
          '--accent-hover-border': '#b84300',
          '--focus-halo': 'rgba(184, 67, 0, 0.22)',
          '--card-bg': '#ffffff',
          '--card-hover-bg': '#fcfbf9',
          '--card-sheen': 'rgba(184, 67, 0, 0.06)',
          '--card-border': '#3f3f46',
          '--card-shadow': '0 6px 20px rgba(10, 10, 12, 0.06)',
          '--card-title': '#0a0a0c',
          '--card-sub': '#27272a',
          '--icon-bg': '#f4f3ef',
          '--icon-hover-bg': '#fff3eb',
          '--icon-border': '#52525b',
          '--icon-fg': '#0a0a0c',
          '--arrow-color': '#27272a',
          '--emblem-shadow': '0 0 0 5px #faf9f6, 0 0 0 6px #3f3f46, 0 12px 28px rgba(10, 10, 12, 0.10)',
          '--toggle-bg': '#ffffff',
          '--toggle-border': '#3f3f46',
          '--toggle-hover-bg': '#f4f3ef'
        }
      };

      function applyTheme(mode) {
        var next = mode === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        var tokens = THEMES[next];
        root.setAttribute('data-theme', next);
        root.style.colorScheme = next;
        for (var prop in tokens) {
          if (Object.prototype.hasOwnProperty.call(tokens, prop)) {
            root.style.setProperty(prop, tokens[prop]);
          }
        }
        var metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) {
          metaTheme.setAttribute('content', tokens['--bg-color']);
        }
        var btn = document.getElementById('theme-toggle');
        if (btn) {
          var labelText = next === 'light' ? 'Включить тёмную тему' : 'Включить контрастную светлую тему';
          btn.setAttribute('aria-label', labelText);
          btn.setAttribute('title', labelText);
        }
      }

      var saved = 'dark';
      try {
        var stored = localStorage.getItem('pap-theme');
        if (stored === 'light' || stored === 'dark') {
          saved = stored;
        }
      } catch (_e) {}

      applyTheme(saved);

      window.addEventListener('DOMContentLoaded', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') || saved);

        var cards = document.querySelectorAll('a.card');
        for (var i = 0; i < cards.length; i++) {
          cards[i].addEventListener('pointermove', function (ev) {
            var rect = ev.currentTarget.getBoundingClientRect();
            ev.currentTarget.style.setProperty('--mx', (ev.clientX - rect.left).toFixed(1) + 'px');
            ev.currentTarget.style.setProperty('--my', (ev.clientY - rect.top).toFixed(1) + 'px');
          });
        }

        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
          var next = current === 'light' ? 'dark' : 'light';
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduced && typeof document.startViewTransition === 'function') {
            document.startViewTransition(function () {
              applyTheme(next);
            });
          } else {
            applyTheme(next);
          }
          try {
            localStorage.setItem('pap-theme', next);
          } catch (_e) {}
        });
      });
    })();

<body>
  <button
    type="button"
    id="theme-toggle"
    class="theme-toggle fade-in stagger-2"
    aria-label="Включить контрастную светлую тему"
