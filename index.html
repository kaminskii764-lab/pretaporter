  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      background-color: #0b0c0f;
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(232, 98, 12, 0.09) 0%, rgba(24, 25, 32, 0.45) 45%, #0b0c0f 100%);
      color: #f5f2eb;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .emblem {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(245, 242, 235, 0.14);
      margin-bottom: 22px;
    }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f6f4ee;
      text-align: center;
    }
    .rule {
      width: 48px;
      height: 2px;
      background: #e8620c;
      margin: 14px auto 12px;
      border-radius: 2px;
    }
    .subtitle {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245, 242, 235, 0.56);
      text-align: center;
      margin-bottom: 32px;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 68px;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: #f5f2eb;
      background: linear-gradient(180deg, rgba(34, 35, 42, 0.68) 0%, rgba(19, 20, 25, 0.78) 100%);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(245, 242, 235, 0.11);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, background 0.22s ease;
    }
    a.card:hover, a.card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(232, 98, 12, 0.55);
      outline: none;
    }
    a.card:active {
      transform: scale(0.985);
    }
    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(245, 242, 235, 0.07);
      border: 1px solid rgba(245, 242, 235, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #faf8f4;
    }
    .card-sub {
      font-size: 13px;
      color: rgba(245, 242, 235, 0.58);
      line-height: 1.3;
    }
    .arrow {
      color: rgba(245, 242, 235, 0.38);
      flex-shrink: 0;
    }
  </style>
</head>
